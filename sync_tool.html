<!DOCTYPE html>
<html>
<head>
    <title>Beat Sync Helper</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: white; }
        video { width: 400px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; height: 200px; background: #222; color: #0f0; padding: 10px; font-family: monospace; font-size: 16px; border: 1px solid #444; }
        .instructions { font-size: 18px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="instructions">
        <b>HOW TO USE:</b><br>
        1. Click Play on the video.<br>
        2. Press the <b>SPACEBAR</b> at the exact moment each lyric line starts.<br>
        3. Copy the resulting timestamps and send them to me!
    </div>
    
    <!-- We know the exact name of the file in the project directory -->
    <video id="vid" controls src="KARAN AUJLA NEW SONG - ASHKE ON TRENDING  NEW MIXTAPE  #karanaujla #shorts #punjabisong - NOOBER (720p, h264).mp4"></video>
    <br>
    <textarea id="log" readonly>Ready... click play on the video, then tap SPACEBAR on the beats.</textarea>

    <script>
        const vid = document.getElementById('vid');
        const log = document.getElementById('log');
        let timestamps = [];
        
        const lyrics = [
            "1. Bebe kehndi tainu vihauna",
            "2. Te mera shashtar de naal thaaka",
            "3. SHASHTAR (Beat Drop)",
            "4. Das ki kar laina kaava'n",
            "5. Ni mera baaja aala rakha",
            "6. Raha vich rodhe / Behna je yaara...",
            "7. Jatt mudh to zehri...",
            "8. End of animation"
        ];

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent scrolling
                const time = vid.currentTime.toFixed(2);
                
                if (timestamps.length < lyrics.length) {
                    timestamps.push(time);
                    updateLog();
                }
            }
        });

        function updateLog() {
            let out = "TIMESTAMPS:\n";
            for(let i = 0; i < lyrics.length; i++) {
                if (i < timestamps.length) {
                    out += `${timestamps[i]} seconds  -->  ${lyrics[i]}\n`;
                } else {
                    out += `[ waiting... ]   -->  ${lyrics[i]}\n`;
                }
            }
            log.value = out;
        }
        updateLog();
    </script>
</body>
</html>
