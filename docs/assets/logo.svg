<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Chassis Grid -->
    <pattern id="logoGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Discrete 1-Bit Dot Matrix Pattern for OLED Screen -->
    <pattern id="dotMatrix" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#FFFFFF" opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    }
  </style>

  <!-- 1. Outer Machined Chassis Tile -->
  <rect x="4" y="4" width="192" height="192" rx="20" fill="#080A0E" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1.2"/>
  <rect x="8" y="8" width="184" height="184" rx="16" fill="url(#logoGrid)" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>

  <!-- 4 Corner Machined Hex Socket Screws -->
  <g fill="#0D1117" stroke="rgba(255, 255, 255, 0.28)" stroke-width="0.8">
    <!-- Top-Left -->
    <circle cx="22" cy="22" r="3.5"/>
    <polygon points="22,20 23.7,21 23.7,23 22,24 20.3,23 20.3,21" fill="#181F28" stroke="none"/>
    <!-- Top-Right -->
    <circle cx="178" cy="22" r="3.5"/>
    <polygon points="178,20 179.7,21 179.7,23 178,24 176.3,23 176.3,21" fill="#181F28" stroke="none"/>
    <!-- Bottom-Left -->
    <circle cx="22" cy="178" r="3.5"/>
    <polygon points="22,176 23.7,177 23.7,179 22,180 20.3,179 20.3,177" fill="#181F28" stroke="none"/>
    <!-- Bottom-Right -->
    <circle cx="178" cy="178" r="3.5"/>
    <polygon points="178,176 179.7,177 179.7,179 178,180 176.3,179 176.3,177" fill="#181F28" stroke="none"/>
  </g>

  <!-- Top 4-Pin I2C Header Connection (Authentic Gold Pads & PCB Traces) -->
  <g transform="translate(68, 12)">
    <rect x="0" y="0" width="64" height="8" rx="1.5" fill="#0A0D12" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.8"/>
    <!-- 4 Solder Eyelets -->
    <circle cx="10" cy="4" r="2" fill="#D97706" stroke="#B45309" stroke-width="0.6"/>
    <circle cx="26" cy="4" r="2" fill="#D97706" stroke="#B45309" stroke-width="0.6"/>
    <circle cx="42" cy="4" r="2" fill="#D97706" stroke="#B45309" stroke-width="0.6"/>
    <circle cx="58" cy="4" r="2" fill="#D97706" stroke="#B45309" stroke-width="0.6"/>
    <!-- Hairline PCB Traces going into screen -->
    <line x1="10" y1="8" x2="10" y2="28" stroke="rgba(255, 255, 255, 0.20)" stroke-width="0.8"/>
    <line x1="26" y1="8" x2="26" y2="28" stroke="rgba(255, 255, 255, 0.20)" stroke-width="0.8"/>
    <line x1="42" y1="8" x2="42" y2="28" stroke="rgba(255, 255, 255, 0.20)" stroke-width="0.8"/>
    <line x1="58" y1="8" x2="58" y2="28" stroke="rgba(255, 255, 255, 0.20)" stroke-width="0.8"/>
  </g>

  <!-- 2. OLED Display Outer Module Frame (128x64 Aspect Ratio 2:1) -->
  <rect x="28" y="40" width="144" height="88" rx="3" fill="#0A0D12" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1"/>

  <!-- Display Glass Substrate Area -->
  <rect x="36" y="48" width="128" height="68" rx="1" fill="#000000" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.8"/>
  <rect x="36" y="48" width="128" height="68" fill="url(#dotMatrix)"/>

  <!-- Authentic 1-Bit Pixel Typography / Waveform Inside Screen -->
  <!-- Crisp 1-bit phosphor pixels (Zero blur, true square pixel geometry) -->
  <g fill="#FFFFFF">
    <!-- Letter O (5x7 dot matrix font) -->
    <rect x="46" y="62" width="2" height="14"/>
    <rect x="56" y="62" width="2" height="14"/>
    <rect x="48" y="60" width="8" height="2"/>
    <rect x="48" y="76" width="8" height="2"/>

    <!-- Letter L -->
    <rect x="62" y="60" width="2" height="18"/>
    <rect x="64" y="76" width="8" height="2"/>

    <!-- Letter E -->
    <rect x="76" y="60" width="2" height="18"/>
    <rect x="78" y="60" width="8" height="2"/>
    <rect x="78" y="68" width="6" height="2"/>
    <rect x="78" y="76" width="8" height="2"/>

    <!-- Letter D -->
    <rect x="90" y="60" width="2" height="18"/>
    <rect x="92" y="60" width="6" height="2"/>
    <rect x="92" y="76" width="6" height="2"/>
    <rect x="98" y="62" width="2" height="14"/>

    <!-- 1-Bit Digital Audio Waveform / Spectrum on Right -->
    <rect x="110" y="72" width="2" height="6"/>
    <rect x="114" y="66" width="2" height="12"/>
    <rect x="118" y="58" width="2" height="20"/>
    <rect x="122" y="62" width="2" height="16"/>
    <rect x="126" y="68" width="2" height="10"/>
    <rect x="130" y="74" width="2" height="4"/>
    <rect x="134" y="64" width="2" height="14"/>
    <rect x="138" y="70" width="2" height="8"/>
    <rect x="142" y="60" width="2" height="18"/>
    <rect x="146" y="74" width="2" height="4"/>

    <!-- Horizontal baseline scanline -->
    <line x1="46" y1="88" x2="154" y2="88" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.8"/>
    <!-- Status text inside OLED -->
    <text x="46" y="102" fill="rgba(255, 255, 255, 0.7)" class="text-mono" font-size="7" letter-spacing="1">128×64 · 30 FPS</text>
  </g>

  <!-- 3. Bottom Information & Model Readout (Teenage Engineering Typography) -->
  <g transform="translate(100, 150)">
    <text x="0" y="0" fill="#FFFFFF" class="text-mono" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">OLEDIFY</text>
    <circle cx="-38" cy="-4" r="2" fill="#FF5500"/>
    <circle cx="38" cy="-4" r="2" fill="#FF5500"/>
    <text x="0" y="15" fill="rgba(255, 255, 255, 0.45)" class="text-mono" font-size="8" letter-spacing="1.2" text-anchor="middle">ESP32-S3 · WEBSERIAL</text>
  </g>
</svg>
